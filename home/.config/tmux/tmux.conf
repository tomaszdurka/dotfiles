# tmux config
# Goal: live in one terminal window, switch between named sessions,
# and have every session survive tmux restarts and machine reboots
# (tmux-resurrect saves state, tmux-continuum restores it automatically).
#
# Prefix is the default Ctrl+b (matches herdr's keybindings too).
# Cheat sheet:
#   prefix c        new window          prefix "  split below
#   prefix n/p      next/prev window    prefix %  split right
#   prefix s        session tree        prefix f  fuzzy session switcher
#   prefix d        detach (session keeps running)
#   prefix h/j/k/l  move between panes

# --- Behavior ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1           # windows start at 1 (matches keyboard order)
setw -g pane-base-index 1
set -g renumber-windows on    # no gaps after closing a window
set -g set-clipboard on
set -g escape-time 10         # don't delay Escape (matters in nvim)
set -g focus-events on

# --- Keys -------------------------------------------------------------------
# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Fuzzy session switcher in a popup
bind f display-popup -E "tmux list-sessions -F '#S' | fzf --reverse | xargs -r tmux switch-client -t"

# Copy mode: vi keys, mouse selection copies to the macOS clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Reload this file
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Status bar (rose-pine moon colors) -------------------------------------
set -g status-position top
set -g status-style "bg=#232136,fg=#e0def4"
set -g status-left "#[fg=#c4a7e7,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=#908caa]%H:%M "
setw -g window-status-format "#[fg=#908caa] #I:#W "
setw -g window-status-current-format "#[fg=#ea9a97,bold] #I:#W "

# --- Plugins (managed by TPM) -----------------------------------------------
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @resurrect-capture-pane-contents "on"  # restore visible pane text too
set -g @continuum-restore "on"                # auto-restore on tmux start
set -g @continuum-save-interval "10"          # autosave every 10 minutes

# Initialize TPM (keep this line at the very bottom)
run "~/.config/tmux/plugins/tpm/tpm"
